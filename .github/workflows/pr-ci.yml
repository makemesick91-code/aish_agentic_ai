name: pr-ci

# CICD-CTRL-1 unified PR-lifecycle CI (rule 28).
#   * Draft PR  -> fast CI only (CI-PRINCIPLE-03).
#   * Ready PR  -> one full release CI on the final head (CI-PRINCIPLE-04/05).
#   * Stale runs for the same PR are cancelled when a new head arrives (CI-PRINCIPLE-07).
#   * A single stable required gate ("pr-ci / Required Gate") always reports (CI-PRINCIPLE-08).
#   * Change classification is INTERNAL — no top-level path filter on this mandatory
#     workflow (CI-PRINCIPLE-09); unknown/mixed changes fail closed (CI-PRINCIPLE-10).
# Security gates (secret scan, workflow security, tenant-isolation when it exists)
# are never optimized away (CI-PRINCIPLE-15). Least privilege by default (CI-PRINCIPLE-17).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      categories: ${{ steps.classify.outputs.categories }}
      full_safe_suite: ${{ steps.classify.outputs.full_safe_suite }}
      run_workflow_security: ${{ steps.classify.outputs.run_workflow_security }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/ci/*.sh scripts/docs/*.sh scripts/graphify/*.sh scripts/hooks/*.sh scripts/codex/*.sh scripts/release/*.sh .codex/hooks/*.sh
      - name: Classify changed files (fail closed)
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/classify-changes.sh

  draft-fast-ci:
    name: Draft fast CI
    needs: classify-changes
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/ci/*.sh scripts/docs/*.sh scripts/graphify/*.sh scripts/hooks/*.sh scripts/codex/*.sh scripts/release/*.sh .codex/hooks/*.sh
      - name: Fast gate (drafts run fast CI only)
        run: scripts/ci/fast-local.sh

  full-documentation-ci:
    name: Full documentation CI
    needs: classify-changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/ci/*.sh scripts/docs/*.sh scripts/graphify/*.sh scripts/hooks/*.sh scripts/codex/*.sh scripts/release/*.sh .codex/hooks/*.sh
      - name: CI validator unit tests
        run: |
          scripts/ci/test-change-classifier.sh
          scripts/ci/test-required-gate.sh
      - name: Full documentation-as-code suite (with evidence)
        run: scripts/docs/validate.sh
      - name: Aggregate ADR / AGENTS / codex gates
        run: |
          scripts/docs/check-adr.sh
          scripts/codex/check-agents.sh
          scripts/codex/check-codex.sh
      - name: ShellCheck (non-blocking lint)
        run: |
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning scripts/ci/*.sh scripts/release/*.sh scripts/docs/*.sh scripts/graphify/*.sh scripts/hooks/*.sh scripts/codex/*.sh .codex/hooks/*.sh || true
          else
            echo "shellcheck unavailable; skipping (non-blocking lint)"
          fi

  workflow-security-ci:
    name: Workflow security CI
    needs: classify-changes
    # Security gate: runs on EVERY ready PR, never gated by change classification
    # (AFR-119 — security gates are never optimized/routed away). The classifier's
    # run_workflow_security flag is informational only; it cannot skip this job.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/ci/*.sh scripts/release/*.sh
      - name: Workflow security + topology
        run: |
          scripts/ci/validate-workflow-security.sh
          scripts/ci/validate-ci-topology.sh

  backend-runtime-ci:
    name: Backend runtime CI
    needs: classify-changes
    # The Laravel application exists as of Step 5, so the runtime suite is now REAL,
    # not a placeholder (rule 28, AFR-125 satisfied; AFR-133). It runs on every ready
    # PR (never skipped) against real PostgreSQL + Redis service containers, so a
    # `skipped` conclusion can never masquerade as a pass on the required gate.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aish_agentic_ai
          POSTGRES_USER: aish
          POSTGRES_PASSWORD: aish_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aish -d aish_agentic_ai"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    # NOTE: DB/Redis connection env is scoped to the runtime-verification step ONLY, so the
    # hermetic PHPUnit suite (sqlite/array/sync via phpunit.xml) is never affected by the
    # service-container settings. Real PostgreSQL + Redis are exercised by verify-runtime.sh.
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, dom, curl, xml, bcmath
          coverage: none
          tools: composer:v2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Make scripts executable
        run: chmod +x scripts/runtime/*.sh scripts/ci/*.sh
      - name: Validate composer
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Formatting (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Unit + feature + architecture tests
        run: php artisan test
      - name: Dependency audit (PHP)
        run: composer audit
      - name: Install + build frontend
        run: |
          npm ci
          npm run build
      - name: Dependency audit (JS)
        run: npm audit --audit-level=high
      - name: End-to-end runtime verification (Postgres + Redis)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: aish_agentic_ai
          DB_USERNAME: aish
          DB_PASSWORD: aish_ci_ephemeral
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: redis
          VERIFY_COMPOSE: "0"
        run: scripts/runtime/verify-runtime.sh
      - name: SaaS core tenant-isolation verification (real PostgreSQL + Redis)
        # Step 6: exercises tenant isolation across DB, Redis cache, and Redis queue on
        # real infrastructure — an open socket is not proof (rule 29, rule 30).
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: aish_agentic_ai
          DB_USERNAME: aish
          DB_PASSWORD: aish_ci_ephemeral
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: redis
          MAIL_MAILER: log
        run: php artisan aish:verify-saas-core

  required-gate:
    name: Required Gate
    needs: [classify-changes, draft-fast-ci, full-documentation-ci, workflow-security-ci, backend-runtime-ci]
    # Runs on BOTH draft and ready (always()). On a draft the decision script exits
    # NON-ZERO on purpose, so `pr-ci / Required Gate` is RED until a ready run posts a
    # real green — a draft's fast-CI-only pass can never satisfy branch protection on
    # the same SHA after "ready". (A job skipped via `if:` would post a `skipped`
    # conclusion, which branch protection treats as PASSING — hence run-and-fail, not skip.)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Decide the single required conclusion
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          FAST_RESULT: ${{ needs.draft-fast-ci.result }}
          FULL_DOC_RESULT: ${{ needs.full-documentation-ci.result }}
          WF_SEC_RESULT: ${{ needs.workflow-security-ci.result }}
          BACKEND_RESULT: ${{ needs.backend-runtime-ci.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          CATEGORIES: ${{ needs.classify-changes.outputs.categories }}
        run: |
          echo "PR #${{ github.event.pull_request.number }} — tested head: ${{ github.event.pull_request.head.sha }}"
          echo "Change categories: ${CATEGORIES:-<none>}"
          echo "Draft: ${IS_DRAFT}"
          echo "Suites: classify=${CLASSIFY_RESULT} fast=${FAST_RESULT} full-doc=${FULL_DOC_RESULT} wf-sec=${WF_SEC_RESULT} backend=${BACKEND_RESULT}"
          chmod +x scripts/ci/required-gate-decision.sh
          scripts/ci/required-gate-decision.sh
